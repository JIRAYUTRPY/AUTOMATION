name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != package.json $pkg"; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image prefix
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push images
        run: |
          version="${GITHUB_REF_NAME#v}"
          for svc in web worker updater; do
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -f "apps/$svc/Dockerfile" \
              --build-arg "APP_VERSION=$version" \
              -t "$PREFIX-$svc:$version" -t "$PREFIX-$svc:latest" \
              --push .
          done
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
